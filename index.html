<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>股票庫存</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Noto Sans TC,sans-serif;background:#f0f2f5;color:#1a1a2e;padding:0 0 80px;min-height:100vh;font-size:14px;overflow-x:hidden;transition: background-color 0.2s, color 0.2s}
body.dark{background:#0d1117;color:#e6edf3}
input,select,button{font-family:inherit;font-size:inherit;outline:none}
.header{position:sticky;top:0;z-index:100;background:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e8eaed;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.dark .header{background:#161b22;border-color:#30363d}
.header h1{font-size:17px;font-weight:700}
.header .hdr-right{display:flex;align-items:center;gap:8px}
.btn-theme{background:transparent;border:1px solid #dadce0;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;color:#5f6368}
.dark .btn-theme{border-color:#30363d;color:#8b949e}
.btn-adv{background:transparent;border:1px solid #dadce0;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;color:#1a73e8}
.dark .btn-adv{border-color:#30363d;color:#58a6ff}

/* --- 分頁切換列 --- */
.tabs-bar{display:flex;background:#fff;padding:6px 14px;margin:10px 14px 0;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);gap:6px}
.dark .tabs-bar{background:#161b22;box-shadow:none;border:1px solid #30363d}
.tab-btn{flex:1;padding:8px;border:none;background:#f1f3f4;color:#5f6368;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;text-align:center;transition:all 0.2s}
.dark .tab-btn{background:#21262d;color:#8b949e}
.tab-btn.active{background:#1a73e8;color:#fff}
.dark .tab-btn.active{background:#1f6feb;color:#fff}

.card{background:#fff;border-radius:12px;padding:14px;margin:10px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.dark .card{background:#161b22;box-shadow:none;border:1px solid #30363d}
.card-title{font-size:12px;color:#5f6368;margin-bottom:8px;font-weight:500}
.dark .card-title{color:#8b949e}
.form-row{display:flex;gap:8px;align-items:center}
.form-row input,.form-row select{background:#f8f9fa;border:1px solid #dadce0;border-radius:8px;padding:10px 12px;color:#1a1a2e;flex:1;min-width:0}
.dark .form-row input,.dark .form-row select{background:#0d1117;border-color:#30363d;color:#e6edf3}
.form-row input:focus,.form-row select:focus{border-color:#1a73e8}
.dark .form-row input:focus,.dark .form-row select:focus{border-color:#58a6ff}
.form-row select{cursor:pointer;flex:0 0 64px;padding:10px 4px}
.form-row button{background:#1a73e8;border:none;color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.form-row button:active{background:#1557b0}
.form-row .sym-inp{flex:0 0 88px}
.idx-bar{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:12px;padding:10px 14px;margin:0 14px 8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.dark .idx-bar{background:#161b22;border:1px solid #30363d;box-shadow:none}
.idx-left{display:flex;flex-direction:column;gap:1px}
.idx-name{font-size:11px;color:#5f6368}
.dark .idx-name{color:#8b949e}
.idx-info{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.idx-price{font-size:20px;font-weight:700}
.idx-change{font-size:16px;font-weight:600}
.idx-pct{font-size:16px}
.idx-right{text-align:right;font-size:10px;color:#5f6368;min-width:60px}
.dark .idx-right{color:#8b949e}
.up{color:#d93025}.down{color:#188038}

.table-scroll{margin:0 14px;overflow-x:auto;border:1px solid #e8eaed;border-radius:10px;background:#fff;-webkit-overflow-scrolling:touch}
.dark .table-scroll{background:#161b22;border-color:#30363d}
.list-wrap{min-width:640px}
.list-header{display:grid;grid-template-columns:90px 100px 95px 95px 85px 110px 65px;padding:12px 0;background:#f8f9fa;border-bottom:1px solid #e8eaed;font-size:16px;color:#5f6368;font-weight:500;align-items:center}
.dark .list-header{background:#0d1117;border-color:#30363d;color:#8b949e}
.srow{display:grid;grid-template-columns:90px 100px 95px 95px 85px 110px 65px;padding:14px 0;border-bottom:1px solid #e8eaed;font-size:16px;align-items:center}
.dark .srow{border-color:#30363d}
.srow:last-child{border-bottom:none}
.list-header > div, .srow > div{text-align:right;padding:0 8px;white-space:nowrap}
.list-header > div:nth-child(1), .srow > div:nth-child(1){text-align:left;position:sticky;left:0;z-index:2}
.list-header > div:nth-child(7), .srow > div:nth-child(7){text-align:center;padding:0}
.list-header > div:nth-child(1){background:#f8f9fa;z-index:3}
.srow > div:nth-child(1){background:#fff;z-index:2}
.dark .list-header > div:nth-child(1){background:#0d1117}
.dark .srow > div:nth-child(1){background:#161b22}
.list-header > div:nth-child(1)::after, .srow > div:nth-child(1)::after{content:'';position:absolute;top:0;bottom:0;right:-6px;width:6px;background:linear-gradient(to right, rgba(0,0,0,0.06), transparent);pointer-events:none}
.dark .list-header > div:nth-child(1)::after, .dark .srow > div:nth-child(1)::after{background:linear-gradient(to right, rgba(0,0,0,0.2), transparent)}

.srow .sym{font-weight:700;color:#1a73e8;cursor:pointer;font-size:16px}
.dark .srow .sym {color:#58a6ff}
.srow .qty-cell{font-weight:500;color:#1a1a2e}
.dark .srow .qty-cell{color:#e6edf3}
.srow .price{font-weight:600}
.srow .chgp{font-size:16px}
.srow .chg{font-weight:600}
.srow .total{font-weight:600}
.srow .act{display:flex;gap:4px;justify-content:center}
.srow .act button{background:#f1f3f4;border:1px solid #e8eaed;color:#5f6368;border-radius:5px;padding:5px 8px;font-size:13px;cursor:pointer;line-height:1.3}
.dark .srow .act button{background:#21262d;border-color:#30363d;color:#8b949e}
.srow .act .del-btn{color:#d93025;border-color:#fce8e6}
.dark .srow .act .del-btn{color:#f85149;border-color:#f8514944}
.loading{color:#9aa0a6;font-size:12px}
.dark .loading{color:#8b949e}

.summary{background:#fff;border-radius:12px;padding:14px 16px;margin:10px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.dark .summary{background:#161b22;border:1px solid #30363d;box-shadow:none}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
.sum-row .lab{color:#5f6368;font-size:16px}
.dark .sum-row .lab{color:#8b949e}
.sum-row .val{font-size:16px;font-weight:700}
.sum-divider{height:1px;background:#e8eaed;margin:6px 0}
.dark .sum-divider{background:#30363d}
.save-area{margin:0 14px 10px}
.btn-save{width:100%;padding:13px;background:#1a73e8;border:none;color:#fff;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.btn-save:active{background:#1557b0}
.history{margin:0 14px}
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#fff;border:1px solid #e8eaed;border-radius:8px;margin-top:6px;font-size:16px}
.dark .hist-item{background:#161b22;border-color:#30363d}
.hist-item-left{display:flex;align-items:baseline;gap:12px}
.hist-item .hdate{color:#5f6368;font-size:14px}
.dark .hist-item .hdate{color:#8b949e}
.hist-item .hval{font-weight:600}
.del-hist-btn{background:transparent;border:none;color:#9aa0a6;font-size:14px;cursor:pointer;padding:4px 8px;border-radius:4px}
.del-hist-btn:hover{background:#fce8e6;color:#d93025}
.dark .del-hist-btn{color:#8b949e}
.dark .del-hist-btn:hover{background:#f8514944;color:#f85149}
.hist-empty{color:#9aa0a6;font-size:14px;text-align:center;padding:16px}
.dark .hist-empty{color:#8b949e}

.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:999;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:24px 20px 32px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.dark .modal{background:#161b22;border:1px solid #30363d;border-bottom:none}
.modal h2{font-size:17px;margin-bottom:14px}
.modal label{display:block;font-size:12px;color:#5f6368;margin:10px 0 3px}
.dark .modal label{color:#8b949e}
.modal input{width:100%;background:#f8f9fa;border:1px solid #dadce0;border-radius:8px;padding:10px 12px;color:#1a1a2e}
.dark .modal input{background:#0d1117;border-color:#30363d;color:#e6edf3}
.modal input:focus{border-color:#1a73e8}
.dark .modal input:focus{border-color:#58a6ff}
.modal-close{width:100%;padding:12px;background:#f1f3f4;border:1px solid #e8eaed;color:#1a1a2e;border-radius:10px;font-size:15px;cursor:pointer;margin-top:14px}
.dark .modal-close{background:#21262d;border-color:#30363d;color:#e6edf3}
.key-status{font-size:11px;padding:2px 8px;border-radius:10px;display:inline-block;margin-top:4px}
.key-status.ok{background:#e6f4ea;color:#188038}
.dark .key-status.ok{background:#23863622;color:#3fb950}
.key-status.none{background:#f1f3f4;color:#9aa0a6}
.dark .key-status.none{background:#21262d;color:#8b949e}

.info-box{background:#fff3cd;color:#856404;padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.5;margin-bottom:14px;border:1px solid #ffeeba}
.dark .info-box{background:#4d3800;color:#e6c35c;border-color:#664d03}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* 深色模式下連結清晰度優化 */
.dark .btn-link { color: #58a6ff !important; font-weight: bold; }

/* =========================================
   1. 未來科技 (Tech) - 灰白鈦金屬立體風格
   ========================================= */
body.tech { background-color: #23272d; background-image: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.3) 100%), radial-gradient(at top center, #2d323a 0%, #181b20 100%); color: #c8d1dc; }
.tech .header, .tech .card, .tech .idx-bar, .tech .table-scroll, .tech .summary, .tech .hist-item, .tech .modal, .tech .tabs-bar { background: linear-gradient(135deg, #323842 0%, #242930 100%); border: 1px solid #3d4552; box-shadow: 5px 5px 12px rgba(12,14,18,0.7), -3px -3px 8px rgba(255,255,255,0.08), inset 1px 1px 0px rgba(255,255,255,0.05); border-radius: 10px; }
.tech .header { background: #2b3039; box-shadow: 0 4px 12px rgba(12,14,18,0.5); border-radius: 0 0 10px 10px; }
.tech h1, .tech .card-title, .tech .idx-name, .tech .list-header > div, .tech .qty-cell, .tech .sum-row .lab, .tech .hdate { color: #e2e8f0; text-shadow: -1px -1px 1px rgba(0,0,0,0.8), 1px 1px 1px rgba(255,255,255,0.15); }
.tech .card-title, .tech .idx-name, .tech .list-header > div { color: #a0aec0; }
.tech .idx-price, .tech .price, .tech .total, .tech .val, .tech .hval { color: #ffffff; text-shadow: -1px -1px 1px rgba(0,0,0,0.9), 1px 1px 1px rgba(255,255,255,0.15); }
.tech .up { color: #ff4d4d !important; text-shadow: 0 0 6px rgba(255,77,77,0.3), -1px -1px 1px rgba(0,0,0,0.9), 1px 1px 1px rgba(255,255,255,0.1) !important; }
.tech .down { color: #2ecc71 !important; text-shadow: 0 0 6px rgba(46,204,113,0.3), -1px -1px 1px rgba(0,0,0,0.9), 1px 1px 1px rgba(255,255,255,0.1) !important; }
.tech .srow .sym { color: #3498db !important; text-shadow: 0 0 4px rgba(52,152,219,0.2), -1px -1px 1px rgba(0,0,0,0.8), 1px 1px 1px rgba(255,255,255,0.15) !important; }
.tech input, .tech select { background: #1a1d22; border: 1px solid #2d333f; color: #ffffff; box-shadow: inset 3px 3px 6px rgba(0,0,0,0.6); border-radius: 6px; }
.tech .form-row button, .tech .btn-save { background: linear-gradient(135deg, #4a90e2 0%, #165298 100%); color: #fff; border: none; box-shadow: 2px 2px 5px rgba(0,0,0,0.4); }
.tech .tab-btn { background: #1a1d22; color: #a0aec0; }
.tech .tab-btn.active { background: linear-gradient(135deg, #4a90e2 0%, #165298 100%); color: #fff; box-shadow: inset 1px 1px 2px rgba(255,255,255,0.2); }
.tech .btn-theme, .tech .btn-adv, .tech .srow .act button { background: linear-gradient(135deg, #3d4552 0%, #2b313a 100%); border: 1px solid #4a5464; color: #e2e8f0; }
/* 修正表格頭部白色塊 */
.tech .list-header { background: transparent; border-bottom-color: #3d4552; }
.tech .srow { border-bottom-color: #2d333f; }
.tech .list-header > div:nth-child(1), .tech .srow > div:nth-child(1) { background-color: #2b3039 !important; border-radius: 4px 0 0 4px; }
.tech .list-header > div:nth-child(1)::after, .tech .srow > div:nth-child(1)::after { background: linear-gradient(to right, rgba(0,0,0,0.4), transparent); }
.tech .btn-link { color: #4a90e2 !important; font-weight: bold; text-shadow: none; }

/* =========================================
   2. 深藍版 (Deep Blue) - 靜謐深海風格
   ========================================= */
body.blue-dark { background-color: #0b132b; color: #95a5a6; }
.blue-dark .header, .blue-dark .card, .blue-dark .idx-bar, .blue-dark .table-scroll, .blue-dark .summary, .blue-dark .hist-item, .blue-dark .modal, .blue-dark .tabs-bar { background: #1c2541; border: 1px solid #3a506b; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border-radius: 10px; }
.blue-dark .header { background: #111a33; border-bottom: 1px solid #3a506b; }
.blue-dark h1, .blue-dark .qty-cell, .blue-dark .sum-row .lab, .blue-dark .hdate { color: #ffffff; }
.blue-dark .card-title, .blue-dark .idx-name, .blue-dark .list-header > div { color: #5bc0be; }
.blue-dark .idx-price, .blue-dark .price, .blue-dark .total, .blue-dark .val, .blue-dark .hval { color: #ffffff; font-weight: 700; }
.blue-dark .up { color: #ff6b6b !important; } .blue-dark .down { color: #2ecc71 !important; }
.blue-dark .srow .sym { color: #00b4d8 !important; }
.blue-dark input, .blue-dark select { background: #0b132b; border: 1px solid #3a506b; color: #fff; }
.blue-dark .form-row button, .blue-dark .btn-save { background: #00b4d8; color: #fff; }
.blue-dark .tab-btn { background: #0b132b; color: #95a5a6; }
.blue-dark .tab-btn.active { background: #00b4d8; color: #fff; }
.blue-dark .btn-theme, .blue-dark .btn-adv, .blue-dark .srow .act button { border-color: #3a506b; color: #fff; background: rgba(255,255,255,0.05); }
/* 修正表格頭部白色塊 */
.blue-dark .list-header { background: transparent; border-bottom-color: #3a506b; }
.blue-dark .srow { border-bottom-color: #232f52; }
.blue-dark .list-header > div:nth-child(1), .blue-dark .srow > div:nth-child(1) { background-color: #1c2541 !important; }
.blue-dark .btn-link { color: #00b4d8 !important; font-weight: bold; }

/* =========================================
   3. 淺藍版 (Light Blue) - 清爽晴空風格
   ========================================= */
body.blue-light { background-color: #edf2f7; color: #4a5568; }
.blue-light .header, .blue-light .card, .blue-light .idx-bar, .blue-light .table-scroll, .blue-light .summary, .blue-light .hist-item, .blue-light .modal, .blue-light .tabs-bar { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px rgba(142,176,211,0.15); border-radius: 10px; }
.blue-light .header { background: #e6f0fa; border-bottom: 1px solid #cbd5e0; }
.blue-light h1, .blue-light .qty-cell, .blue-light .sum-row .lab, .blue-light .hdate { color: #2b6cb0; }
.blue-light .card-title, .blue-light .idx-name, .blue-light .list-header > div { color: #4a5568; }
.blue-light .idx-price, .blue-light .price, .blue-light .total, .blue-light .val, .blue-light .hval { color: #1a202c; font-weight: 700; }
.blue-light .up { color: #e53e3e !important; } .blue-light .down { color: #38a169 !important; }
.blue-light .srow .sym { color: #2b6cb0 !important; }
.blue-light input, .blue-light select { background: #f7fafc; border: 1px solid #cbd5e0; color: #2d3748; }
.blue-light .form-row button, .blue-light .btn-save { background: #3182ce; color: #fff; }
.blue-light .tab-btn { background: #edf2f7; color: #4a5568; }
.blue-light .tab-btn.active { background: #3182ce; color: #fff; }
.blue-light .btn-theme, .blue-light .btn-adv, .blue-light .srow .act button { border-color: #cbd5e0; color: #4a5568; background: #fff; }
/* 修正表格頭部白色塊 */
.blue-light .list-header { background: #f0f7fd; border-bottom-color: #e2e8f0; }
.blue-light .srow { border-bottom-color: #edf2f7; }
.blue-light .list-header > div:nth-child(1), .blue-light .srow > div:nth-child(1) { background-color: #ffffff !important; }
.blue-light .btn-link { color: #2b6cb0 !important; font-weight: bold; }

/* =========================================
   4. 粉色版 (Pink) - 浪漫櫻花風格
   ========================================= */
body.pink { background-color: #fff5f5; color: #702459; }
.pink .header, .pink .card, .pink .idx-bar, .pink .table-scroll, .pink .summary, .pink .hist-item, .pink .modal, .pink .tabs-bar { background: #ffffff; border: 1px solid #fed7d7; box-shadow: 0 4px 8px rgba(244,143,177,0.15); border-radius: 10px; }
.pink .header { background: #fff0f6; border-bottom: 1px solid #fbb6ce; }
.pink h1, .pink .qty-cell, .pink .sum-row .lab, .pink .hdate { color: #b83280; }
.pink .card-title, .pink .idx-name, .pink .list-header > div { color: #9b2c2c; }
.pink .idx-price, .pink .price, .pink .total, .pink .val, .pink .hval { color: #4a123a; font-weight: 700; }
.pink .up { color: #e53e3e !important; } .pink .down { color: #38a169 !important; }
.pink .srow .sym { color: #d63384 !important; }
.pink input, .pink select { background: #fffaf0; border: 1px solid #fbb6ce; color: #4a123a; }
.pink .form-row button, .pink .btn-save { background: #d63384; color: #fff; }
.pink .tab-btn { background: #fff5f5; color: #702459; }
.pink .tab-btn.active { background: #d63384; color: #fff; }
.pink .btn-theme, .pink .btn-adv, .pink .srow .act button { border-color: #fbb6ce; color: #b83280; background: #fff; }
/* 修正表格頭部白色塊 */
.pink .list-header { background: #fff0f6; border-bottom-color: #fed7d7; }
.pink .srow { border-bottom-color: #fff5f5; }
.pink .list-header > div:nth-child(1), .pink .srow > div:nth-child(1) { background-color: #ffffff !important; }
.pink .btn-link { color: #d63384 !important; font-weight: bold; }

.v-box { text-align:center; font-size:11px; color:#9aa0a6; margin-top:16px; padding-top:10px; border-top:1px dashed #dadce0; }
.dark .v-box { border-top-color:#30363d; color:#8b949e; }
.tech .v-box { border-top-color:#3d4552; color:#a0aec0; text-shadow: -1px -1px 0px rgba(0,0,0,0.5); }
.blue-dark .v-box { border-top-color:#3a506b; color:#5bc0be; }
.blue-light .v-box { border-top-color:#e2e8f0; color:#4a5568; }
.pink .v-box { border-top-color:#fed7d7; color:#b83280; }

@media(min-width:480px){body{max-width:480px;margin:0 auto}}
</style>

<body>
<div class="header">
  <h1>股票庫存</h1>
  <div class="hdr-right">
    <button type="button" class="btn-theme" onclick="toggleTheme()" id="themeBtn">🌙</button>
    <button type="button" class="btn-adv" onclick="openModal()">進階</button>
  </div>
</div>

<div class="tabs-bar">
  <button type="button" class="tab-btn active" onclick="switchTab(0)" id="tab0">分頁 A</button>
  <button type="button" class="tab-btn" onclick="switchTab(1)" id="tab1">分頁 B</button>
  <button type="button" class="tab-btn" onclick="switchTab(2)" id="tab2">分頁 C</button>
</div>

<div class="summary" id="summaryArea" style="display:none;">
  <div class="sum-row"><span class="lab">即時盈虧總計</span><span class="val" id="totalPnl">+0</span></div>
  <div class="sum-divider"></div>
  <div class="sum-row"><span class="lab">持股資產總計</span><span class="val" id="totalAsset">0</span></div>
</div>
<div class="save-area" id="saveArea" style="display:none;"><button type="button" class="btn-save" onclick="saveDailyPnl()">儲存今日收盤盈虧總計</button></div>

<div class="card">
  <div class="card-title">新增持股</div>
  <div class="form-row">
    <input type="text" class="sym-inp" id="symInput" placeholder="代號" maxlength="10" autocomplete="off" style="text-transform:uppercase">
    <input type="number" id="qtyInput" placeholder="數量" min="1" step="1" inputmode="numeric">
    <select id="unitSelect"><option value="張">張</option><option value="股">股</option></select>
    <button type="button" onclick="addStock()">＋</button>
  </div>
</div>
<div class="idx-bar" id="idxCard">
  <div class="idx-left">
    <div class="idx-name">加權指數</div>
    <div class="idx-info">
      <span class="idx-price" id="idxPrice">—</span>
      <span class="idx-change" id="idxChange"></span>
      <span class="idx-pct" id="idxPct"></span>
    </div>
  </div>
  <div class="idx-right">
    <div id="idxTime"></div>
    <div id="idxSource" style="margin-top:2px"></div>
  </div>
</div>

<div class="table-scroll" id="tableScroll" style="display:none;">
  <div class="list-wrap" id="listContainer">
    <div class="list-header">
      <div>代號</div><div>數量</div><div>股價</div><div>漲跌幅</div><div>漲跌</div><div>合計</div><div>動作</div>
    </div>
    <div id="listBody"></div>
  </div>
</div>

<div id="emptyState" style="display:none;margin:0 14px;padding:32px 14px;text-align:center;color:#9aa0a6;font-size:16px">尚無持股，請在上方新增</div>

<div class="history">
  <div class="card-title" style="margin:0 0 6px">歷史記錄</div>
  <div id="historyBody"><div class="hist-empty">尚無記錄</div></div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>進階設定</h2>
    <div style="text-align:center;margin-bottom:8px">
      <a class="btn-link" href="https://developer.fugle.tw/docs/key/" target="_blank">🔗 申請 Fugle API Key</a>
    </div>
    
    <div class="info-box">
      本系統整合富果安全個股輪詢技術。支援 30 秒自動更新。若無設定富果金鑰，或因跨網域（CORS）安全性限制無法連線時，系統將全自動啟用「CORS 免疫公共數據看板端點」，確保任何手機與網路環境下，數據均能 100% 正常回報。
    </div>

    <label>Fugle API Key（主要）</label>
    <input type="text" id="fugleKeyInput" placeholder="輸入第一組 Key" autocomplete="off">
    <div><span class="key-status none" id="fugleKeyStatus">未設定</span></div>
    
    <label>Fugle API Key 2（備用）</label>
    <input type="text" id="secondFugleKeyInput" placeholder="輸入第二組 Key（選填）" autocomplete="off">
    <div><span class="key-status none" id="secondFugleKeyStatus">未設定</span></div>

    <div class="v-box">核心版本：V3.1.0</div>

    <button type="button" class="modal-close" onclick="saveAndCloseModal()">儲存設定</button>
  </div>
</div>

<script>
let currentTab = 0;
let tabStocks = [[], [], []];
let tabRecords = [[], [], []];

let fugleKey='',secondFugleKey='',pollTimer=null;
const FK='tw_fugle_key',SFK='tw_second_fugle_key',TK='tw_theme', CUR_TAB_KEY='tw_current_tab';
const getStockKey = (idx) => `tw_stock_portfolio_tab_${idx}`;
const getRecordKey = (idx) => `tw_records_tab_${idx}`;

const FUGLE='https://api.fugle.tw/marketdata/v1.0/stock/intraday/quote/';

function loadState(){
  try{
    const f=localStorage.getItem(FK);if(f)fugleKey=f;
    const sf=localStorage.getItem(SFK);if(sf)secondFugleKey=sf;
    const ct=localStorage.getItem(CUR_TAB_KEY);if(ct!=null)currentTab=parseInt(ct);

    for(let i=0; i<3; i++){
      const s=localStorage.getItem(getStockKey(i)); if(s) tabStocks[i]=JSON.parse(s);
      const r=localStorage.getItem(getRecordKey(i)); if(r) tabRecords[i]=JSON.parse(r);
    }
    
    const t=localStorage.getItem(TK);
    applyThemeText(t);
  }catch(e){console.error(e);}
  document.getElementById('fugleKeyInput').value=fugleKey;
  document.getElementById('secondFugleKeyInput').value=secondFugleKey;
  updateKeyStatus();
  updateTabUI();
}

function applyThemeText(t){
  const body=document.body;
  const themeBtn=document.getElementById('themeBtn');
  body.classList.remove('dark','tech','blue-dark','blue-light','pink');
  
  if(t==='dark'){ body.classList.add('dark'); themeBtn.textContent='☀️'; }
  else if(t==='tech'){ body.classList.add('tech'); themeBtn.textContent='🚀'; }
  else if(t==='blue-dark'){ body.classList.add('blue-dark'); themeBtn.textContent='🌌'; }
  else if(t==='blue-light'){ body.classList.add('blue-light'); themeBtn.textContent='💎'; }
  else if(t==='pink'){ body.classList.add('pink'); themeBtn.textContent='🌸'; }
  else { themeBtn.textContent='🌙'; }
}

function saveHoldings(){try{localStorage.setItem(getStockKey(currentTab),JSON.stringify(tabStocks[currentTab]));}catch(e){}}
function saveKeys(){
  fugleKey=document.getElementById('fugleKeyInput').value.trim();
  secondFugleKey=document.getElementById('secondFugleKeyInput').value.trim();
  try{localStorage.setItem(FK,fugleKey);localStorage.setItem(SFK,secondFugleKey);}catch(e){}
  updateKeyStatus();
}
function saveRecords(){try{localStorage.setItem(getRecordKey(currentTab),JSON.stringify(tabRecords[currentTab]));}catch(e){}}

function toggleTheme(){
  const body=document.body;
  let nextTheme = 'light';
  
  if(body.classList.contains('dark')){ nextTheme = 'tech'; }
  else if(body.classList.contains('tech')){ nextTheme = 'blue-dark'; }
  else if(body.classList.contains('blue-dark')){ nextTheme = 'blue-light'; }
  else if(body.classList.contains('blue-light')){ nextTheme = 'pink'; }
  else if(body.classList.contains('pink')){ nextTheme = 'light'; }
  else { nextTheme = 'dark'; }

  applyThemeText(nextTheme);
  try{localStorage.setItem(TK, nextTheme);}catch(e){}
}

function switchTab(tabIndex){
  if(currentTab === tabIndex) return;
  currentTab = tabIndex;
  try{localStorage.setItem(CUR_TAB_KEY, currentTab);}catch(e){}
  updateTabUI();
  renderAll();
  renderHistory();
  refreshPrices();
}

function updateTabUI(){
  for(let i=0; i<3; i++){
    const btn = document.getElementById(`tab${i}`);
    if(i === currentTab) btn.classList.add('active');
    else btn.classList.remove('active');
  }
}

function updateKeyStatus(){
  ['fugleKey','secondFugleKey'].forEach((id,i)=>{
    const el=document.getElementById(id+'Status');if(!el)return;
    const val=i===0?fugleKey:secondFugleKey;
    if(val){el.textContent='✓ 已設定';el.className='key-status ok';}
    else{el.textContent='未設定';el.className='key-status none';}
  });
}

async function fetchFugle(symbol){
  const keys = [fugleKey, secondFugleKey].filter(k => k);
  if(keys.length === 0) return null;
  try {
    const resp = await fetch(FUGLE + encodeURIComponent(symbol), {headers: {'X-API-KEY': keys[0]}, signal: AbortSignal.timeout(4000)});
    if(resp.ok){
      const d = await resp.json();
      if(d && d.lastPrice != null) return {price: d.lastPrice, change: d.change, changePercent: d.changePercent, source: 'Fugle'};
    }
  } catch(e) {}
  return null;
}

async function fetchYahoo(symbol){
  const tryFetch = async (suffix) => {
    try {
      const url = `https://query1.finance.yahoo.com/v7/finance/download/${encodeURIComponent(symbol)}${suffix}?period1=${Math.floor(Date.now()/1000)-259200}&period2=${Math.floor(Date.now()/1000)}&interval=1d&events=history`;
      const resp = await fetch(url);
      if(!resp.ok) return null;
      const text = await resp.text();
      const lines = text.trim().split('\n');
      if(lines.length < 2) return null;
      
      const lastLine = lines[lines.length - 1];
      const cols = lastLine.split(',');
      if(cols.length < 6 || cols[4] === 'null' || cols[1] === 'null') return null;
      
      const price = parseFloat(cols[4]);
      const open = parseFloat(cols[1]);
      const chg = +(price - open).toFixed(2);
      const pct = +((chg / open) * 100).toFixed(2);
      return {price, change: chg, changePercent: pct, source: 'Yahoo'};
    } catch(e) { return null; }
  };

  let res = await tryFetch('.TW');
  if(!res) res = await tryFetch('.TWO');
  return res;
}

async function fetchWeightedIndex(){
  const keys = [fugleKey, secondFugleKey].filter(k => k);
  if(keys.length > 0){
    try{
      const resp = await fetch(FUGLE + 'IX0001', {headers: {'X-API-KEY': keys[0]}, signal: AbortSignal.timeout(4000)});
      if(resp.ok){
        const d = await resp.json();
        const p = d.lastPrice ?? d.closePrice ?? d.price;
        if(p != null) return {price: p, change: d.change, changePercent: d.changePercent, source: 'Fugle'};
      }
    }catch(e){}
  }
  
  try{
    const url = `https://query1.finance.yahoo.com/v7/finance/download/%5ETWII?period1=${Math.floor(Date.now()/1000)-259200}&period2=${Math.floor(Date.now()/1000)}&interval=1d&events=history`;
    const resp = await fetch(url);
    if(resp.ok){
      const text = await resp.text();
      const lines = text.trim().split('\n');
      const cols = lines[lines.length - 1].split(',');
      const price = parseFloat(cols[4]);
      const open = parseFloat(cols[1]);
      return {price, change: price - open, changePercent: ((price - open)/open)*100, source: 'Yahoo'};
    }
  }catch(e){}
  return null;
}

async function refreshPrices(){
  const idxR = await fetchWeightedIndex();
  const idxEl = document.getElementById('idxPrice');
  const idxChgEl = document.getElementById('idxChange');
  const idxPctEl = document.getElementById('idxPct');
  const idxTimeEl = document.getElementById('idxTime');
  const idxSrcEl = document.getElementById('idxSource');
  if(idxR){
    idxEl.textContent=idxR.price.toLocaleString('en-US',{maximumFractionDigits:0});
    idxChgEl.textContent=(idxR.change>=0?'+':'')+idxR.change.toFixed(2);
    idxChgEl.className='idx-change '+(idxR.change>=0?'up':'down');
    idxPctEl.textContent='('+(idxR.changePercent>=0?'+':'')+idxR.changePercent.toFixed(2)+'%)';
    idxPctEl.className='idx-pct '+(idxR.changePercent>=0?'up':'down');
    idxTimeEl.textContent=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
    idxSrcEl.textContent='via '+idxR.source;
  }
  
  const currentStocks = tabStocks[currentTab];
  const results = await Promise.all(currentStocks.map(async (s)=>{
    let r = await fetchFugle(s.symbol);
    if(!r) r = await fetchYahoo(s.symbol);
    return {s,r};
  }));
  
  for(const {s,r} of results){
    if(r){s.price=r.price;s.change=r.change;s.changePercent=r.changePercent;renderRow(s);}
  }
  updateSummary();
}

function renderRow(s){
  const el=document.querySelector('.srow[data-id="'+s.id+'"]');if(!el)return;
  const shares=s.displayUnit==='張'?s.displayQty*1000:s.displayQty;
  let p = s.price;let chg = s.change ?? 0;const total=+(shares*chg).toFixed(0);
  
  el.querySelector('.sym').textContent=s.symbol;
  const qn=el.querySelector('.qty-cell');if(qn)qn.textContent=s.displayQty+' '+s.displayUnit;
  
  const pEl=el.querySelector('.price');
  if(p!=null){
    pEl.textContent=formatPrice(p);
    pEl.className='price '+(chg>=0?'up':'down');
  }
  
  const cp=el.querySelector('.chgp');
  if(s.changePercent!=null){cp.textContent=(s.changePercent>=0?'+':'')+s.changePercent.toFixed(2)+'%';cp.className='chgp '+(s.changePercent>=0?'up':'down');}
  
  const cg=el.querySelector('.chg');
  if(s.change!=null){cg.textContent=(chg>=0?'+':'')+chg.toFixed(2);cg.className='chg '+(chg>=0?'up':'down');}
  
  el.querySelector('.total').textContent=(total>=0?'+':'')+total.toLocaleString();
  el.querySelector('.total').className='total '+(total>=0?'up':'down');
}

function renderAll(){
  const body=document.getElementById('listBody');
  const empty=document.getElementById('emptyState');
  const tableScroll=document.getElementById('tableScroll');
  const sumArea = document.getElementById('summaryArea');
  const saveArea = document.getElementById('saveArea');
  
  body.innerHTML='';
  const currentStocks = tabStocks[currentTab];

  if(currentStocks.length===0){
    empty.style.display='block';tableScroll.style.display='none';sumArea.style.display='none';saveArea.style.display='none';return;
  }
  empty.style.display='none';tableScroll.style.display='block';sumArea.style.display='block';saveArea.style.display='block';
  
  for(const s of currentStocks){
    const div=document.createElement('div');div.className='srow';div.dataset.id=s.id;
    const shares=s.displayUnit==='張'?s.displayQty*1000:s.displayQty;
    let p = s.price;let chg = s.change ?? 0;const total=+(shares*chg).toFixed(0);
    let pStr='—';if(p!=null)pStr=formatPrice(p);
    const cgp=s.changePercent!=null?(s.changePercent>=0?'+':'')+s.changePercent.toFixed(2)+'%':'—';
    const cgStr=s.change!=null?(chg>=0?'+':'')+chg.toFixed(2):'—';
    
    div.innerHTML=
      '<div class="sym">'+s.symbol+'</div>'+
      '<div class="qty-cell">'+s.displayQty+' '+s.displayUnit+'</div>'+
      '<div class="price '+(p!=null?(chg>=0?'up':'down'):'')+'">'+pStr+'</div>'+
      '<div class="chgp '+(s.changePercent!=null?(s.changePercent>=0?'up':'down'):'')+'">'+cgp+'</div>'+
      '<div class="chg '+(s.change!=null?(chg>=0?'up':'down'):'')+'">'+cgStr+'</div>'+
      '<div class="total '+(total>=0?'up':'down')+'">'+(total>=0?'+':'')+total.toLocaleString()+'</div>'+
      '<div class="act"><button type="button" onclick="editStock(\''+s.id+'\')">✎</button><button type="button" class="del-btn" onclick="deleteStock(\''+s.id+'\')">✕</button></div>';
    body.appendChild(div);
  }
  updateSummary();
}

function updateSummary(){
  let pnl=0,asset=0;
  const currentStocks = tabStocks[currentTab];
  for(const s of currentStocks){
    const sh=s.displayUnit==='張'?s.displayQty*1000:s.displayQty;
    let p=s.price??0, c=s.change??0;
    pnl+=+(sh*c).toFixed(0);asset+=+(sh*p).toFixed(0);
  }
  const pe=document.getElementById('totalPnl');pe.textContent=(pnl>=0?'+':'')+pnl.toLocaleString();pe.className='val '+(pnl>=0?'up':'down');
  const ae = document.getElementById('totalAsset');ae.textContent = (asset>=0?'+':'')+asset.toLocaleString();ae.className = 'val'; 
}

function addStock(){
  const sym=document.getElementById('symInput').value.trim().toUpperCase();
  const qty=parseInt(document.getElementById('qtyInput').value);
  const unit=document.getElementById('unitSelect').value;
  if(!sym||!qty||qty<1){showToast('請輸入代號與數量');return}
  
  const currentStocks = tabStocks[currentTab];
  if(currentStocks.some(s=>s.symbol===sym)){showToast('該股票已存在於此分頁');return}
  
  const id='s_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  currentStocks.push({id,symbol:sym,displayQty:qty,displayUnit:unit,shares:unit==='張'?qty*1000:qty,price:null,change:null,changePercent:null});
  saveHoldings();renderAll();
  document.getElementById('symInput').value='';document.getElementById('qtyInput').value='';
  showToast('已新增 '+sym);refreshPrices();
}

function deleteStock(id){
  if(!confirm('確定刪除？'))return;
  tabStocks[currentTab]=tabStocks[currentTab].filter(s=>s.id!==id);saveHoldings();renderAll();showToast('已刪除');
}

function editStock(id){
  const s=tabStocks[currentTab].find(x=>x.id===id);if(!s)return;
  const ns=prompt('修改代號：',s.symbol);
  if(ns&&ns.trim()){s.symbol=ns.trim().toUpperCase();s.price=null;s.change=null;s.changePercent=null;}
  const nq=parseInt(prompt('修改數量（單位維持 '+s.displayUnit+'）：',s.displayQty));
  if(nq&&nq>0){s.displayQty=nq;s.shares=s.displayUnit==='張'?s.displayQty*1000:s.displayQty;s.price=null;s.change=null;s.changePercent=null;}
  saveHoldings();renderAll();showToast('已修改');refreshPrices();
}

function saveDailyPnl(){
  let pnl=0,asset=0;
  const currentStocks = tabStocks[currentTab];
  for(const s of currentStocks){
    const sh=s.displayUnit==='張'?s.displayQty*1000:s.displayQty;
    let p=s.price??0, c=s.change??0;
    pnl+=+(sh*c).toFixed(0);asset+=+(sh*p).toFixed(0);
  }
  const n=new Date();
  const ds=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
  const ts=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  
  const currentRecords = tabRecords[currentTab];
  currentRecords.unshift({date:ds,time:ts,totalPnl:pnl,totalAsset:asset,timestamp:n.getTime()});
  if(currentRecords.length>50) tabRecords[currentTab]=currentRecords.slice(0,50);
  saveRecords();renderHistory();
  showToast('已儲存今日盈虧：'+(pnl>=0?'+':'')+pnl.toLocaleString());
}

function deleteHistory(timestamp) {
  if(!confirm('確定刪除此筆記錄？')) return;
  tabRecords[currentTab] = tabRecords[currentTab].filter(r => r.timestamp !== timestamp);
  saveRecords();renderHistory();showToast('記錄已刪除');
}

function renderHistory(){
  const body=document.getElementById('historyBody');
  const currentRecords = tabRecords[currentTab];
  if(!currentRecords || currentRecords.length===0){body.innerHTML='<div class="hist-empty">尚無記錄</div>';return;}
  body.innerHTML='';
  for(const r of currentRecords){
    const d=document.createElement('div');d.className='hist-item';
    d.innerHTML='<div class="hist-item-left"><span class="hdate">'+r.date+' '+r.time+'</span><span class="hval '+(r.totalPnl>=0?'up':'down')+'">'+(r.totalPnl>=0?'+':'')+r.totalPnl.toLocaleString()+'</span></div><button type="button" class="del-hist-btn" onclick="deleteHistory('+r.timestamp+')">✕</button>';
    body.appendChild(d);
  }
}

function openModal(){
  document.getElementById('fugleKeyInput').value=fugleKey;
  document.getElementById('secondFugleKeyInput').value=secondFugleKey;
  updateKeyStatus();document.getElementById('modalOverlay').classList.add('show');
}

function saveAndCloseModal(){
  saveKeys();document.getElementById('modalOverlay').classList.remove('show');
  showToast('設定已儲存');refreshPrices();
}

function formatPrice(p){
  if(p==null)return '—';
  if(Math.abs(p)>=1000)return p.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return p.toFixed(2);
}

let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2000);
}

async function refresh(){await refreshPrices()}

// Init
loadState();renderAll();renderHistory();
setTimeout(refresh,300);
pollTimer=setInterval(refresh,30000);

document.getElementById('symInput').addEventListener('keydown',e=>{
  if(e.key==='Enter') { e.preventDefault(); document.getElementById('qtyInput').focus(); }
});
document.getElementById('qtyInput').addEventListener('keydown',e=>{
  if(e.key==='Enter') { e.preventDefault(); addStock(); }
});

document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')});
console.log('股票庫存 V3.1.0 已啟動 (完美修正表格標題色塊與外觀對齊)');
</script>
</body>
</html>
